server:
  port: ${PORT:8080}
  servlet:
    context-path: /api/v1

spring:
  application:
    name: bookworm-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bookworm}
    username: ${DB_USER:bookworm}
    password: ${DB_PASSWORD:bookworm}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health

bookworm:
  jwt:
    # Override in any real deployment. Must be at least 32 bytes.
    secret: ${JWT_SECRET:bookworm-dev-secret-change-me-bookworm-dev-secret}
    expiry-seconds: 3600
  pricing:
    tax-rate: 0.12
    free-delivery-threshold: 500.00
    delivery-charge: 40.00
    # 1 point is worth 1 INR when redeemed
    point-value: 1.00
    # 1 point is earned per 100 INR of the order total
    earn-per-inr: 100
  orders:
    cancel-window-hours: 48
  cors:
    allowed-origins: http://localhost:5173,http://localhost:3000
